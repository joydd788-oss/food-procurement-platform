spring:
  application: { name: food-procurement-api }
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/procurement}
    username: ${SPRING_DATASOURCE_USERNAME:procurement}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa: { open-in-view: false }
  flyway: { enabled: true }
  data.redis:
    host: ${SPRING_DATA_REDIS_HOST:localhost}
    password: ${SPRING_DATA_REDIS_PASSWORD:change-me}
server: { servlet: { context-path: /api } }
springdoc: { swagger-ui: { path: /swagger-ui.html }, api-docs: { path: /v3/api-docs } }
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
    com.foodprocurement: INFO
app:
  users:
    - username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD}
      roles: ADMIN,REGULATOR
    - username: ${BUYER_USERNAME:buyer}
      password: ${BUYER_PASSWORD}
      roles: BUYER
    - username: ${SUPPLIER_USERNAME:supplier}
      password: ${SUPPLIER_PASSWORD}
      roles: SUPPLIER
